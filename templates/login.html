<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - السحابة الشخصية</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #1e293b; padding: 40px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); width: 340px; text-align: center; border: 1px solid #334155; }
        h2 { margin-bottom: 10px; color: #38bdf8; }
        input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: white; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #0284c7; border: none; color: white; font-weight: bold; border-radius: 6px; cursor: pointer; margin-top: 10px; transition: 0.3s; }
        button:hover { background: #0369a1; }
        .error { color: #f87171; font-size: 14px; margin-top: 10px; background: rgba(239, 68, 68, 0.1); padding: 8px; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="card">
        <h2> Cloud Storage</h2>
        <p style="font-size: 13px; color: #94a3b8;">سحابة آمنة لتخزين وإدارة الصور</p>
        {% if error %}<div class="error">{{ error }}</div>{% endif %}
        <form method="POST">
            <input type="text" name="username" placeholder="اسم المستخدم" required>
            <input type="password" name="password" placeholder="كلمة المرور" required>
            <button type="submit">دخول للسحابة</button>
        </form>
    </div>
</body>
</html>
