<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم السحابية</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #0b0f19; color: #f8fafc; margin: 0; padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; background: #1e293b; padding: 15px 30px; border-radius: 10px; border-bottom: 2px solid #0284c7; }
        .btn-logout { background: #ef4444; color: white; padding: 8px 16px; border-radius: 6px; text-decoration: none; font-size: 14px; }
        .upload-box { background: #1e293b; padding: 25px; border-radius: 10px; margin: 20px 0; border: 2px dashed #0284c7; text-align: center; }
        .upload-btn { background: #0284c7; padding: 10px 20px; border-radius: 6px; cursor: pointer; color: white; font-weight: bold; display: inline-block; }
        .submit-btn { background: #10b981; padding: 10px 25px; border: none; border-radius: 6px; color: white; font-weight: bold; cursor: pointer; margin-top: 15px; }
        .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; margin-top: 25px; }
        .img-card { background: #1e293b; border-radius: 10px; overflow: hidden; border: 1px solid #334155; transition: transform 0.3s, box-shadow 0.3s; }
        .img-card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(2, 132, 199, 0.3); }
        .img-card img { width: 100%; height: 180px; object-fit: cover; }
        .img-card .title { padding: 10px; font-size: 13px; color: #cbd5e1; text-align: center; word-break: break-all; }
    </style>
</head>
<body>
    <div class="header">
        <h2> Cloud Storage Platform</h2>
        <div>
            <span>المستخدم الحالي: <b>{{ username }}</b></span> | 
            <a href="{{ url_for('logout') }}" class="btn-logout">خروج</a>
        </div>
    </div>

    <div class="upload-box">
        <h3>رفع صورة جديدة إلى السحابة</h3>
        <form method="POST" action="/upload" enctype="multipart/form-data">
            <input type="file" name="file" id="file" required style="display:none;" onchange="document.getElementById('fileName').innerText = 'تم اختيار: ' + this.files[0].name">
            <label class="upload-btn" for="file">اختر صورة من حاسوبك</label>
            <p id="fileName" style="font-size: 13px; color: #38bdf8; margin-top: 10px;"></p>
            <br>
            <button type="submit" class="submit-btn">رفع إلى السيرفر السحابي</button>
        </form>
    </div>

    <h3> الصور المخزنة في الكلاود:</h3>
    <div class="gallery">
        {% for image in images %}
        <div class="img-card">
            <img src="{{ url_for('uploaded_file', filename=image) }}" alt="Cloud Image">
            <div class="title">{{ image }}</div>
        </div>
        {% else %}
        <p style="color: #64748b;">السحابة فارغة حالياً. قم برفع أول صورة!</p>
        {% endfor %}
    </div>
</body>
</html>
